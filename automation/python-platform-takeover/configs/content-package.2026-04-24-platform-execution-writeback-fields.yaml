platforms:
  weibo:
    title: "别让复盘错位：发完内容后，最该先让 AI 写回的是后台真实字段"
    description: "很多团队内容发出去以后，第二天复盘还在对错内容。问题不在不会发，而在发完以后没有立刻写回真实后台字段：真实标题、真实链接、发布时间、状态词、一句诊断、下一步动作。字段一旦没写回，复盘表、平台数据和后续判断都会一起错位。更适合先交给 AI 员工的，不是再写一版空洞总结，而是把这些真实字段自动写回。人做判断，AI 负责补字段。#AI员工 #内容复盘 #平台执行"
  douyin:
    title: "别让复盘错位"
    description: "很多团队内容发完以后，第二天复盘总在对错内容。问题不在不会发，而在发完以后没有立刻写回真实后台字段：真实标题、真实链接、发布时间、状态词、一句诊断、下一步动作。字段一旦没写回，复盘表、平台数据和后续判断都会一起错位。更该先交给 AI 员工的，不是再补一版空洞总结，而是把这些真实字段自动写回。人做判断，AI 负责补字段。#AI员工 #内容复盘 #平台执行 #复盘错位"
  wechat_channels:
    title: "复盘别再错位"
    description: "很多团队内容发出去以后，第二天复盘还在对错内容。问题不在不会发，而在发完以后没有立刻写回真实后台字段：真实标题、真实链接、发布时间、状态词、一句诊断、下一步动作。字段一旦没写回，复盘表、平台数据和后续判断都会一起错位。更该先交给 AI 员工的，不是再写一版空洞总结，而是把这些真实字段自动写回。人只做判断，AI 负责补字段。"
  kuaishou:
    title: "AI员工补字段"
    description: "内容发完不等于结束。很多团队第二天复盘总错位，真正漏掉的是发完以后没把真实标题、真实链接、发布时间和状态词写回字段。更该先交给 AI 的，是补字段和写回复盘表。人做判断，AI 负责写回。"
  baijiahao:
    title: "很多团队复盘总错位，不是不会发，而是发完以后没写回真实字段"
    description: "很多内容团队以为内容发出去就算结束，但第二天一做复盘，经常发现标题对不上、链接没回填、发布时间和状态词缺失，整张表直接错位。真正该先交给 AI 员工的，不是再写一版抽象总结，而是把真实后台标题、真实链接、发布时间、状态词、一句诊断和下一步动作自动写回字段。人继续做判断，AI 负责补字段。"
  toutiao:
    title: "为什么很多团队发完内容后，第二天复盘总错位？问题往往出在真实字段没写回"
    description: "很多团队不是不会发内容，而是发完以后没有把真实后台标题、真实链接、发布时间和状态写回字段。结果第二天一比平台数据，复盘表和真实内容直接错位。更适合先交给 AI 员工的，不是抽象复盘，而是把这些后台真实字段自动写回。人做判断，AI 负责补字段。"
  zhihu:
    title: "为什么很多团队不是不会发内容，而是发完以后没有把真实后台标题、链接和状态写回字段？"
    description: "我越来越认同一个判断：很多团队复盘做不准，不是因为不会分析，而是前一步就做错了。内容发完以后，没有把真实后台标题、真实链接、发布时间、状态词和一句诊断写回字段，第二天再看数据，整张复盘表已经偏了。所以真正该先交给 AI 员工的，不是抽象总结，而是把这些真实字段自动写回。"
  xiaohongshu:
    title: "别让复盘错位：很多团队发完内容后，真正漏掉的是后台真实标题和链接写回"
    description: "很多团队不是不会做复盘，而是发完内容以后，根本没把真实后台标题、真实链接、发布时间和状态词写回字段。结果第二天一看表，内容和数据已经对不上。更该先交给 AI 员工的，不是再写一段空话，而是把这些真实字段自动写回。人做判断，AI 负责补字段。"
