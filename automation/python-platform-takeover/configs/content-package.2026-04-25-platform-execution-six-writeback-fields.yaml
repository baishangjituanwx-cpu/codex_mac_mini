  weibo:
    title: "为什么复盘总错位：很多团队发完内容后，漏掉的是先写回这6个真实字段"
    description: "很多团队第二天复盘总在对错内容。问题不在不会分析，而在发完内容以后没有先把真实标题、真实链接、发布时间、状态词、一句诊断和下一步动作这 6 个字段写回。先把证据写回，再谈复盘结论。比如标题写回“AI员工补字段”，状态写回“已发布”，动作写回“24小时后补抓数据”。人做判断，AI 负责补字段。#AI员工 #内容复盘 #字段写回"
