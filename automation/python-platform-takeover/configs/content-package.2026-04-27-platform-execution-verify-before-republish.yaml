platforms:
  weibo:
    title: "未核验不等于失败：先查发布状态，别急着重发"
    description: "很多团队一看到数据没出来，就急着判失败、急着重发。但真正该先做的是去管理列表确认真实状态：已发布、审核中、草稿、失败。如果只是封面或描述有误，先修旧条，不要先重发。AI员工查列表写状态，人只做发布判断。#AI员工 #内容发布 #平台执行"
  douyin:
    title: "未核验别重发"
    description: "很多团队一看到数据没出来，就急着判失败、急着再发一条。正确动作不是先重发，而是先去管理列表确认：到底是已发布、审核中、草稿，还是失败。如果只是封面或描述有误，先修旧条，不要先重发。AI员工查列表写状态，人只做发布判断。#AI员工 #内容发布 #先核验别重发 #平台执行"
  wechat_channels:
    title: "先核验别重发"
    description: "没进列表，不要先判失败，更不要急着重发。正确动作是先去内容管理列表确认真实状态：已发布、审核中、草稿还是失败。然后再核对标题、描述和封面。只有确认失败才重发；如果只是封面或描述有误，就优先修旧条。AI员工负责查列表写状态，人只做发布判断和复盘。"
  kuaishou:
    title: "先看状态再重发"
    description: "别把暂未可见直接写成失败。先去管理页看状态：已发布、审核中、草稿、失败。封面错了先修旧条，确认失败再重发。AI员工负责查列表，人负责判断。"
  baijiahao:
    title: "很多团队一看到数据没出来就急着重发，真正正确动作是先去管理列表确认发布状态"
    description: "很多团队把暂未可见、审核中、草稿和发布失败混写在一起，结果一看到数据没出来，就马上判内容失败，甚至重复发布。正确动作应该先进入管理列表确认真实状态，再核对标题、描述和封面，最后才决定是修旧条还是重发。"
  toutiao:
    title: "为什么很多团队一看到数据没出来就急着重发？真正漏掉的，是先去管理列表确认发布状态"
    description: "很多团队不是内容失败，而是把暂未可见、审核中、草稿和失败混写在一起，最后一看到数据没出来，就急着再发一条。真正该先做的，不是重发，而是先去管理列表看清楚状态，再决定修旧条还是重发。"
  zhihu:
    title: "为什么很多团队会把未核验写成失败？问题往往不在内容，而在发布状态没有先核验"
    description: "很多团队不是内容失败，而是把发布状态写错了。内容发完以后，如果没有先去管理列表确认真实状态，一看到数据没出来，就把暂未可见、审核中、草稿和失败写成同一种结果，最后不是误判内容，就是直接重复发布。"
  xiaohongshu:
    title: "未核验别重发：很多团队漏的是先看发布状态"
    description: "很多团队一看到数据没出来，就急着判失败、急着再发一条。但真正该先做的，不是重发，而是先去管理列表看状态：已发布、审核中、草稿、失败。如果只是封面或描述有误，先修旧条，不要先重发。"
  bilibili:
    title: "未核验不等于失败：先看列表状态，再决定重发还是修旧条"
    description: "很多团队不是内容失败，而是把“暂未可见”“审核中”“草稿”和“发布失败”混写在一起，最后一看到数据没出来就急着重发。正确动作不是先重发，而是先去管理列表确认真实状态，再核对标题、描述和封面。只有确认失败才重发；如果只是封面或描述有误，就优先修旧条。AI员工负责查列表写状态，人保留最终发布判断。"
