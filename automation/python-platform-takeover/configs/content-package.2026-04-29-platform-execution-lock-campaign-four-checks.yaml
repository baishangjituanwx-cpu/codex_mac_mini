platforms:
  douyin:
    title: "发前先锁批次"
    description: "别把昨天内容发到今天。发前先锁当前批次，再把视频文件、封面文件、短标题、视频描述四项读回比对。任一项不匹配，都不要直接点发表。AI员工先锁批次并读回四项，人只做最后发布判断。#AI员工 #内容发布 #先锁批次 #四项比对"
