  wechat_channels:
    title: "发前先锁批次"
    description: "发布前先锁当前批次，再比对视频、封面、短标题、描述四项。任一项不匹配，都不要点发表。很多误发和重复发布，不是内容差，而是旧回执还在继续推进旧内容。AI员工先锁批次并读回四项，人只做最后发布判断。"
  weibo:
    title: "别把昨天内容发到今天：发前先锁批次，再做四项比对"
    description: "别把昨天内容发到今天。发布前先锁当前批次，再把视频、封面、短标题、描述四项逐项读回。没有先锁批次、也没有做四项比对，最容易把旧回执当成新证据，最后误发甚至重复发布。#AI员工 #内容发布 #发前先锁批次"
  bilibili:
    title: "为什么总会把昨天内容发到今天？发前先锁当前批次，再做四项比对"
    description: "这轮暴露的问题不是内容不会发，而是执行层没有先锁当前 campaign_id，也没有在发表前完成视频、封面、短标题、描述四项比对，结果旧回执继续推进旧内容。正确动作是先锁当前批次，再逐项读回，任一项不匹配都别发表。"
  zhihu:
    title: "为什么总会把昨天的内容发到今天？问题往往不在内容，而在发前没有锁当前批次并做四项比对"
    description: "这轮暴露的问题不是内容失败，而是执行层没有先锁当前 campaign，也没有在发表前完成视频、封面、短标题、描述四项读回。旧回执一旦继续推进旧内容，误发和重复发布就会一起出现。"
  baijiahao:
    title: "很多团队把昨天内容发到今天，不是不会发，而是发前没锁当前批次"
    description: "很多误发和重复发布，不是因为内容差，而是发前没有先锁当前批次，也没有把视频、封面、短标题、描述四项读回比对，最后旧回执继续推动旧内容。"
  toutiao:
