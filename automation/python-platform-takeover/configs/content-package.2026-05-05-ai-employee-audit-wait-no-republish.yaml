platforms:
  douyin:
    title: "看到等待，别急着重发"
    description: "机器人小马一看后台还没公开就想重发，大陈直接拦住：状态看清了吗？等待不是失败，先守住原稿、留好证据、设复查时间。#AI员工 #短视频运营 #发布复盘"
  kuaishou:
    title: "先看状态再重发"
    description: "后台还在等待，小马急着重发。大陈说，别先判失败，先看状态词、留原稿、设复查时间。"
  wechat_channels:
    title: "等待不是失败"
    description: "机器人小马看到内容还没公开就想重发，大陈让它先停下：看清状态、保留原稿、设复查时间，再决定下一步。"
  weibo:
    title: "后台还在等待，为什么大陈不让机器人小马重发？"
    description: "一看到没公开就重发，最容易把归因搞乱。大陈让机器人小马先看状态词、保留原稿、截图留证、设复查时间。等待不是失败。#AI员工 #内容运营 #发布复盘"
  bilibili:
    title: "等待不是失败：大陈让机器人小马先看状态再决定要不要重发"
    description: "这条讲发布后的异常处理：内容还在等待或审核时，不要急着删掉重发。先看状态词、保留原稿、记录链接和复查时间，等结果明确后再决定修旧条还是下一步处理。"
  xiaohongshu:
    title: "别急重发，先看状态"
    description: "小马看到后台还没公开就想重发，大陈直接拦住：先看状态词。等待不是失败，守住原稿，设好复查时间。"
  toutiao:
    title: "后台还在等待，AI员工为什么不能急着重发？"
    description: "内容还没公开，不代表已经失败。AI员工要先看状态词、保留原稿、记录复查时间，再决定是继续等、修旧条，还是重新处理。"
  baijiahao:
    title: "内容还在等待时，为什么不能马上删掉重发？"
    description: "因为等待状态不等于内容失败。贸然重发会让数据归因变乱，也可能产生重复内容。更稳的做法是先看状态词，保留原稿，截图留证，设定复查时间。"
  zhihu:
    title: "为什么内容发布后处于等待状态时，不应该马上重发？"
    description: "因为等待、审核、暂未公开都只是中间状态，不等于内容失败。直接重发会污染数据归因，还可能造成重复发布。更稳妥的做法是先记录状态词、保留原稿、设定复查时间。"

