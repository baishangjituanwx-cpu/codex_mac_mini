platforms:
  douyin:
    title: "别把全平台都判失败"
    description: "机器人小马一看到列表混乱就想全标失败，大陈当场叫停：先分状态，再复查。AI员工不是凭感觉判断，是先把已发布、审核中、待核验分清楚。#AI员工 #内容运营 #发布复盘"
  kuaishou:
    title: "先分状态再判断"
    description: "平台列表一乱，小马差点全判失败。大陈说，先分已发布、审核中、待核验，再决定下一步。"
  wechat_channels:
    title: "先分状态"
    description: "机器人小马把全平台都判失败，大陈当场叫停：AI员工先分状态，再复查，再行动。"
  weibo:
    title: "平台没完全公开，就能说全失败了吗？"
    description: "不能。已发布、审核中、待核验，是三种完全不同的状态。大陈让机器人小马先分状态，再复查，不要凭感觉把全平台都判失败。#AI员工 #内容运营 #发布复盘"
  bilibili:
    title: "别把全平台都判失败：大陈让机器人小马先分状态再复查"
    description: "这条讲发布复盘里的一个常见误判：不同平台可能分别处在已发布、审核中、待核验状态，不能一口气写成失败。AI员工先分状态，再复查，再决定下一步。"
  xiaohongshu:
    title: "别急着判失败"
    description: "小马看到平台列表一乱，就想全标失败。大陈说：先分状态。已发布、审核中、待核验，不能混成一个结论。"
  toutiao:
    title: "平台状态不一致时，AI员工该怎么判断？"
    description: "不要把全平台一口气判失败。先把已发布、审核中、待核验分清楚，再决定继续等、补证据，还是进入下一步处理。"
  baijiahao:
    title: "为什么不能把所有平台都直接判成发布失败？"
    description: "因为已发布、审核中、待核验是不同状态。直接判失败会误导后续处理，也会破坏复盘判断。更稳妥的做法是先分状态、再复查、再决定动作。"
  zhihu:
    title: "为什么多平台发布后，不能直接说“全平台失败”？"
    description: "因为平台状态可能完全不同：有的已发布，有的审核中，有的还需要公开核验。直接说失败会让后续动作变形。更稳妥的是先分状态，再复查，再决定处理方式。"
