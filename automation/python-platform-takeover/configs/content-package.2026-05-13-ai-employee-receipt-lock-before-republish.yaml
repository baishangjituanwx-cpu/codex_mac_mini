platforms:
  douyin:
    title: "缺证据，别重复发布"
    description: "机器人小马看到缺链接就想再点一次发布，大陈当场拦住：先查回执。审核中不是失败，缺证据先补证据，别用重复发布补不确定。#AI员工 #内容运营 #发布复盘"
  kuaishou:
    title: "先查回执别重发"
    description: "小马想再点一次发布，大陈说先查回执。审核中不是失败，缺证据先补证据。"
  wechat_channels:
    title: "先查回执"
    description: "机器人小马想重复发布，大陈叫停：先查回执、看状态词、锁住重复，再补证据。"
  weibo:
    title: "缺公开链接，就能再发一次吗？"
    description: "不能。缺证据不等于失败，审核中也不是失败。大陈让机器人小马先查回执、看状态词、锁重复，再决定要补什么。#AI员工 #内容运营 #发布复盘"
  bilibili:
    title: "别用重复发布补不确定：大陈让机器人小马先查回执和状态词"
    description: "这条讲多平台发布后的重复风险：看不到链接或缺状态词时，不要直接再点一次发布。AI员工要先查回执、看状态词、锁住重复，再补证据。"
  xiaohongshu:
    title: "别用重发补不确定"
    description: "小马看到缺链接就想再发一次。大陈说：先查回执。缺证据先补证据，别重复发布。"
  toutiao:
    title: "审核中或缺链接时，AI员工该不该再发布一次？"
    description: "不应该直接重发。先查回执和状态词，确认是否已有记录，再决定是等待推进、补公开链接，还是补数据证据。"
  baijiahao:
    title: "为什么缺发布证据时，不能马上重复发布？"
    description: "因为缺公开链接、缺状态词，不等于发布失败。重复发布会制造重复条目，也会让后续复盘更乱。更稳妥的做法是先查回执、看状态词、锁住重复，再补证据。"
  zhihu:
    title: "为什么缺证据时，不能用“再发一次”来补救？"
    description: "因为重复发布会制造新问题。真正要补的是公开链接、状态词、发布时间和数据证据。先查回执和发布锁，再决定下一步，才不会把复盘变成猜测。"
