platforms:
  douyin:
    title: "没指标，别判内容差"
    description: "小马一看到数据空白就想说内容差，大陈先叫停：播放、完播、互动、对照没补齐，先别下结论。#AI员工 #内容运营 #数据复盘"
  kuaishou:
    title: "先补指标别判差"
    description: "没有作品行、数据和对照，别急着说内容差。小马要下结论，大陈让它先补核验。"
  wechat_channels:
    title: "别先判差"
    description: "机器人小马看到数据空白就要判内容差，大陈叫停：没指标，不判差。先补作品行、数据、对照。"
  weibo:
    title: "没有播放和完播，就能说内容差吗？"
    description: "不能。没拿到内容级指标前，不要把“未核验”当成内容差。大陈让机器人小马先补作品行、播放完播互动和同形态对照，再决定要不要改。#AI员工 #内容运营 #数据复盘"
  bilibili:
    title: "没拿到指标前，别急着判内容差：大陈让机器人小马先补三件事"
    description: "这条讲内容复盘里最容易犯的一个错：没有播放、完播、互动和对照，就先判断内容差。AI员工要先补作品行、补内容级数据、补同形态对照，再决定是否调整内容。"
  xiaohongshu:
    title: "没指标别判差"
    description: "看到数据空白，先别急着说内容差。大陈让小马先补三件事：作品行、数据、对照。"
  toutiao:
    title: "缺内容级指标时，AI员工该不该先判内容差？"
    description: "不应该。先补作品行、播放完播互动数据和同形态对照，再判断内容是否真的需要调整。没有指标就下结论，只会让复盘跑偏。"
  baijiahao:
    title: "为什么没有内容级指标时，不能先说内容差？"
    description: "因为未核验不等于内容差。没有作品行、播放、完播、互动和同形态对照，复盘很容易变成猜测。更稳妥的做法是先补指标，再判断要不要改内容。"
  zhihu:
    title: "为什么没拿到内容级指标前，不应该先判断内容差？"
    description: "因为这时候缺的是证据，不一定是内容本身的问题。没有作品行、播放、完播、互动和对照，就先说内容差，会让后续调整失去依据。"
