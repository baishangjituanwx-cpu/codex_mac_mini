platforms:
  douyin:
    title: "审核中别改题重发"
    description: "小马看不到指标就想改题重发，大陈直接叫停：先写状态词。审核中不是失败，等分支落盘，通过后再看指标。#AI员工 #内容运营 #发布复盘"
  kuaishou:
    title: "先写状态别重发"
    description: "审核中不是失败。小马想改题重发，大陈让它先写状态词、等分支落盘。"
  wechat_channels:
    title: "先写状态"
    description: "机器人小马看到审核中就想改题重发，大陈叫停：先写状态词，审核中不是失败，通过后再看指标。"
  weibo:
    title: "审核中没出结果，就能改题重发吗？"
    description: "不能。审核中不是失败，短期没指标也不等于内容差。大陈让机器人小马先写状态词、等审核分支落盘、锁住重复，通过后再看指标。#AI员工 #内容运营 #发布复盘"
  bilibili:
    title: "审核中不是失败：大陈让机器人小马先写状态分支，再看指标"
    description: "这条讲多平台发布后最容易误判的一步：看到审核中或暂时没指标，就急着改题重发。AI员工应该先写状态词、记录审核分支、锁住重复，等通过后再看播放、完播和互动指标。"
  xiaohongshu:
    title: "审核中别重发"
    description: "看到审核中，先别急着改题重发。大陈让小马先写状态词，等分支落盘，通过后再看指标。"
  toutiao:
    title: "审核中时，AI员工该不该改标题重发？"
    description: "不应该。先写状态词，记录审核分支，锁住重复，等审核结果明确后再看指标。审核中不是失败，不能用改题重发补不确定。"
  baijiahao:
    title: "为什么审核中时，不该马上改题重发？"
    description: "因为审核中不是失败，短期没有指标也不代表内容差。贸然改题重发会制造重复，也会打乱后续复盘。更稳妥的做法是先写状态词，等待审核分支落盘，通过后再看指标。"
  zhihu:
    title: "为什么审核中不是内容失败，也不该立刻改题重发？"
    description: "因为审核中只是中间状态，不是内容强弱结论。此时应该记录状态词、等待审核分支、锁住重复，通过后再看数据指标，而不是马上改题重发。"
