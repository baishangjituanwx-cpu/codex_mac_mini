platforms:
  douyin:
    title: "别凭感觉砍内容"
    description: "小马看到单条没指标就想砍掉重做，大陈直接拦住：先比三条。指标没齐，别凭感觉砍。#AI员工 #内容运营 #复盘"
  kuaishou:
    title: "先比三条再改"
    description: "单条没指标，不等于内容差。大陈让小马先看同账号同格式，再决定怎么改。"
  wechat_channels:
    title: "先比三条"
    description: "机器人小马想直接砍内容，大陈叫停：指标还没齐，先比同账号同格式三条，再改。"
  weibo:
    title: "一条没指标，就能判内容差吗？"
    description: "不能。大陈让机器人小马先补三条同账号同格式对照：播放、完播、互动没齐之前，别凭感觉砍内容。#AI员工 #内容运营 #复盘"
  bilibili:
    title: "别凭感觉砍内容：AI员工先做同账号三条对照，再决定怎么改"
    description: "这条讲多平台发布后最容易犯的第二个错：看到单条暂时没指标，就想砍掉重做。大陈让机器人小马先补同账号、同格式、近三条对照，再判断内容要不要改。"
  xiaohongshu:
    title: "别急着砍内容"
    description: "单条没指标，先别急着否定。大陈让小马先比三条同格式，再决定怎么改。"
  toutiao:
    title: "一条暂时没指标，AI员工能直接判内容差吗？"
    description: "不能。先补同账号同格式近三条对照，看播放、完播、互动是否齐全，再决定是否改内容。没证据时，最怕凭感觉砍掉重做。"
  baijiahao:
    title: "为什么不能只看单条数据，就判内容失败？"
    description: "因为单条暂时没指标，不等于内容失败。更稳妥的做法是先看同账号、同格式、近三条对照，补齐播放、完播和互动，再决定是否修改。"
  zhihu:
    title: "为什么内容复盘不能只看单条表现，就立刻判失败？"
    description: "因为单条数据常常受发布时间、审核状态和指标延迟影响。判断内容是否要改，应该先补同账号同格式近作对照，再看播放、完播和互动是否支持这个结论。"
