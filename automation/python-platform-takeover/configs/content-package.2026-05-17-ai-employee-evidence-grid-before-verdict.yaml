platforms:
  douyin:
    title: "证据没齐别下结论"
    description: "小马想给内容盖“失败”章，大陈直接拦住：证据齐了吗？状态、指标、对照三格齐了，再下结论。#AI员工 #内容运营 #复盘"
  kuaishou:
    title: "齐了再结论"
    description: "复盘不是盖章判死。状态、指标、对照三格证据齐了，再决定怎么改。"
  wechat_channels:
    title: "齐了再结论"
    description: "机器人小马想直接下结论，大陈叫停：证据齐了吗？先补指标，再看状态和同账号对照。"
  weibo:
    title: "复盘时，证据没齐就能判失败吗？"
    description: "不能。状态、指标、对照三格没齐，结论就容易变成情绪判断。大陈让机器人小马先补证据，再决定是否修改。#AI员工 #内容运营 #复盘"
  bilibili:
    title: "复盘不是盖章判死：AI员工先补三格证据，再决定内容要不要改"
    description: "这条讲多平台内容复盘的第三个关键动作：不要在证据没齐时直接判失败。先看平台状态、内容指标、同账号对照，三格证据齐了，再决定是否改标题、封面或口播结构。"
  xiaohongshu:
    title: "别急着判失败"
    description: "证据没齐，先别盖章。状态、指标、对照三格齐了，再决定怎么改。"
  toutiao:
    title: "内容复盘时，证据没齐能直接下结论吗？"
    description: "不能。平台状态、内容指标、同账号对照都要补齐，才适合判断内容是否需要修改。否则很容易把延迟、审核或样本不足误判成内容失败。"
  baijiahao:
    title: "为什么复盘不能在证据没齐时直接判失败？"
    description: "因为证据不足时，最危险的不是内容差，而是误判后重复动作。先补平台状态、内容指标和同账号对照，三格齐了再决定是否修改。"
  zhihu:
    title: "为什么内容复盘不能在证据没齐时直接下结论？"
    description: "因为单个平台状态、单条暂时没指标，都不足以证明内容失败。更稳的流程是先补平台状态、内容级指标和同账号同格式对照，再决定是否修改。"
