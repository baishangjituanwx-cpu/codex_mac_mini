platforms:
  douyin:
    title: "没指标先别改内容"
    description: "小马想马上改标题换封面，大陈直接拦住：指标窗到了吗？播放、完播、互动还没回，先建采集单，明天再改。#AI员工 #内容运营 #复盘"
  kuaishou:
    title: "等指标再改"
    description: "播放、完播、互动没回来，先别改内容。AI员工先建采集单，明天再判断。"
  wechat_channels:
    title: "等指标再改"
    description: "机器人小马想马上改内容，大陈叫停：指标窗没到，先建播放、完播、互动采集单。"
  weibo:
    title: "指标没回来，就能改标题换封面吗？"
    description: "不能。播放、完播、互动还没回来时，改内容很容易变成凭感觉动作。大陈让机器人小马先建采集单，等指标窗到了再改。#AI员工 #内容运营"
  bilibili:
    title: "指标窗没到别急着改：AI员工先建采集单，再决定内容怎么改"
    description: "这条讲多平台内容复盘里的执行细节：不是看到暂时没数据就改标题、换封面、重做口播，而是先建播放、完播、互动采集单，等指标窗口到了再判断。"
  xiaohongshu:
    title: "先别急着改"
    description: "播放、完播、互动还没回来，先别改标题换封面。建采集单，明天再判断。"
  toutiao:
    title: "指标没回来时，AI员工该不该马上改内容？"
    description: "不应该。先建播放、完播、互动采集单，等指标窗口到了，再决定是否改标题、封面或口播结构。"
  baijiahao:
    title: "为什么指标窗口没到时，不该马上改内容？"
    description: "因为播放、完播、互动没回来时，修改动作很容易变成凭感觉。更稳妥的做法是先建采集单，等指标窗口到了再判断。"
  zhihu:
    title: "为什么内容指标没回来时，不应该马上改标题和封面？"
    description: "因为缺少播放、完播和互动数据时，所谓优化可能只是情绪动作。更稳的流程是先建指标采集单，等数据回来，再决定是否修改内容包装。"
