platforms:
  douyin:
    title: "无新增别判失败"
    description: "小马看到“今日无新增”就想盖失败章，大陈直接拦住：先别判失败。状态、指标、对照三格证据齐了，再决定改不改。#AI员工 #内容复盘 #内容运营"
  kuaishou:
    title: "无新增不是失败"
    description: "别把无新增写成失败。先核验状态、指标、对照，证据齐了再改。"
  wechat_channels:
    title: "无新增不是失败"
    description: "机器人小马想把“今日无新增”写成失败，大陈叫停：后台还没核验，先补状态、指标、对照三格证据。"
  weibo:
    title: "无新增，就能直接判内容失败吗？"
    description: "不能。无新增只是状态，不是失败结论。后台没核验、指标没回来、同账号对照没补齐时，先别改标题封面，先把三格证据补齐。#AI员工 #内容运营"
  bilibili:
    title: "别把无新增写成失败：AI员工先补三格证据，再决定内容要不要改"
    description: "这条讲内容复盘里最容易误判的一步：看到“今日无新增”不要直接写失败。先核验作品行状态、指标窗口和同账号同格式对照，三格齐了，再决定是否改标题、封面或口播结构。"
  xiaohongshu:
    title: "别把无新增判失败"
    description: "今日无新增，不等于内容失败。先补状态、指标、对照三格证据，再决定改不改。"
  toutiao:
    title: "无新增时，AI员工能直接判断内容失败吗？"
    description: "不能。无新增只是状态分支，不是失败结论。应该先核验作品行状态、指标窗口和同账号同格式对照，证据齐了再决定是否修改内容。"
  baijiahao:
    title: "为什么“无新增”不能直接写成内容失败？"
    description: "因为无新增只说明当前没有新增执行记录，不等于内容失败。更稳妥的做法是先补作品状态、指标窗口和同账号对照，三格证据齐了再判断。"
  zhihu:
    title: "为什么内容复盘里不能把“无新增”直接判断为失败？"
    description: "因为无新增、没指标、未核验都只是状态信息，不是失败证据。真正稳妥的复盘流程，是先补作品行状态、指标窗口和同账号同格式对照，再决定是否修改内容包装。"
