platforms:
  douyin:
    title: "审核中别判失败"
    description: "小马看到“审核中、暂无数据”就想盖失败章，大陈直接拦住：先别盖章。数据还没回流，先写未核验，明天补状态、指标、对照。#AI员工 #内容复盘 #内容运营"
  kuaishou:
    title: "先写未核验"
    description: "审核中、暂无数据，不等于失败。先把结论改成未核验，等状态、指标、对照齐了再动。"
  wechat_channels:
    title: "先写未核验"
    description: "机器人小马想把审核中写成失败，大陈叫停：数据还没回流，先改成未核验，明天补状态、指标、对照。"
  weibo:
    title: "审核中/暂无数据，就能判内容失败吗？"
    description: "不能。审核中、暂无数据、未回流，都只是状态信息，不是失败证据。先写未核验，等状态、指标、同账号对照齐了，再决定是否改标题封面。#AI员工 #内容运营"
  bilibili:
    title: "审核中不是失败：AI员工先把结论改成未核验，再决定要不要改内容"
    description: "这条讲内容复盘里最容易误判的一步：看到审核中、暂无数据，不要直接盖失败章。先把结论栏改成未核验，明天补作品状态、指标回流和同账号对照，证据齐了再决定是否改标题、封面或口播结构。"
  xiaohongshu:
    title: "先别盖失败章"
    description: "审核中和暂无数据，都不是失败证据。先写未核验，等状态、指标、对照齐了再改。"
  toutiao:
    title: "审核中和暂无数据时，AI员工能直接判内容失败吗？"
    description: "不能。审核中、暂无数据、指标未回流都只是状态信息，不是失败结论。应该先把结论改成未核验，等作品状态、指标和同账号对照齐了再判断。"
  baijiahao:
    title: "为什么“审核中/暂无数据”不能直接写成内容失败？"
    description: "因为这些信息只说明当前状态还没核验完成，不代表内容失败。更稳妥的做法是先写未核验，再补作品状态、指标回流和同账号对照，证据齐了再决定是否修改。"
  zhihu:
    title: "为什么内容复盘里不能把“审核中、暂无数据”直接判为失败？"
    description: "因为审核中、暂无数据、未回流都只是状态信息，不是失败证据。真正稳妥的流程，是先把结论改成未核验，再补作品状态、指标回流和同账号同格式对照。"
