platforms:
  douyin:
    title: "没指标别判死"
    description: "小马看到“暂无指标”就想盖失败章，大陈直接拦住：先别判死。状态、指标、对照三格齐了，再判断要不要改包装。#AI员工 #内容复盘 #内容运营"
  kuaishou:
    title: "先补三格"
    description: "没指标，不等于失败。先补状态、指标、对照，证据齐了再判断。"
  wechat_channels:
    title: "先补三格"
    description: "机器人小马想把“暂无指标”写成失败，大陈叫停：先补状态、指标、对照三格证据，齐了再判断。"
  weibo:
    title: "没指标，就能直接判内容失败吗？"
    description: "不能。没指标、无新增、未核验，都只能说明证据没齐。先补状态、指标、同账号对照，再决定要不要改标题封面。#AI员工 #内容运营"
  bilibili:
    title: "别用没指标判死内容：AI员工先补三格证据，再决定要不要改包装"
    description: "这条讲内容复盘里最容易误判的一步：看到暂无指标，不要直接写失败。先看作品行状态，再等指标窗口，再做同账号同格式对照。三格证据齐了，再决定标题、封面或口播结构要不要改。"
  xiaohongshu:
    title: "别用没指标判死"
    description: "没指标，不等于失败。先补三格：状态、指标、对照，证据齐了再改。"
  toutiao:
    title: "没指标时，AI员工能直接判断内容失败吗？"
    description: "不能。没指标只能说明证据还没齐，不代表内容失败。更稳妥的流程是先补作品行状态、指标窗口和同账号对照，再决定是否修改标题、封面或内容结构。"
  baijiahao:
    title: "为什么“暂无指标”不能直接写成内容失败？"
    description: "因为暂无指标只说明数据和对照还没有补齐，不是失败证据。应该先补作品行状态、指标窗口和同账号同格式对照，三格齐了再判断。"
  zhihu:
    title: "为什么内容复盘里不能用“没指标”直接判定失败？"
    description: "因为没指标、无新增、未核验都只是证据缺口，不是失败证据。真正稳妥的流程，是先补作品行状态、指标窗口和同账号同格式对照，再决定是否改包装。"
