platforms:
  douyin:
    title: "别急着补发"
    description: "小马看到“今日无新增”就想马上补发，大陈直接拦住：先别补发。回执、状态、对照没核完，补发只会污染样本。#AI员工 #内容复盘 #内容运营"
  kuaishou:
    title: "先查回执"
    description: "无新增，不等于失败。先查回执、状态、对照，再决定要不要补发。"
  wechat_channels:
    title: "先查回执"
    description: "机器人小马想用补发救数据，大陈叫停：回执、状态、对照没核完，先别污染样本。"
  weibo:
    title: "无新增，就要马上补发吗？"
    description: "不一定。无新增、没核验、没对照，都不是失败证据。先查回执、状态、同账号对照，再决定要不要补发。#AI员工 #内容运营"
  bilibili:
    title: "无新增别急着补发：AI员工先查回执、状态、对照，别污染样本"
    description: "这条讲内容复盘里另一个容易误判的动作：看到无新增，不要马上补发或重发。先核验发布回执、作品状态和同账号对照，证据没齐就补发，只会污染后续判断样本。"
  xiaohongshu:
    title: "别急着补发"
    description: "今日无新增，不等于失败。先查回执、状态、对照，别让补发污染样本。"
  toutiao:
    title: "无新增时，AI员工应该马上补发一条吗？"
    description: "不应该直接补发。无新增只能说明当前没有新执行样本，不代表内容失败。更稳妥的流程是先查发布回执、作品状态和同账号对照，再决定是否补发或调整包装。"
  baijiahao:
    title: "为什么“无新增”时不能急着补发？"
    description: "因为补发会改变样本结构，影响后续判断。无新增时应先核验发布回执、作品状态和同账号对照，确认问题来源后，再决定是否补发、重发或调整内容包装。"
  zhihu:
    title: "为什么内容复盘里不能一看到无新增就补发？"
    description: "因为无新增不是失败证据，冲动补发会污染对照样本。稳妥的做法是先核验发布回执、作品状态和同账号同格式对照，确认原因后再决定下一步。"
