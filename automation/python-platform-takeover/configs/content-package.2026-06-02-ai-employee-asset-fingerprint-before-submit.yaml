platforms:
  douyin:
    title: "发前先锁三件套"
    description: "文件名一样，不代表资产一样。视频、封面、文案三件套先锁指纹，一致再发，别让平台任务拿到旧封面。#AI员工 #内容发布 #运营复盘"
  kuaishou:
    title: "一致再发"
    description: "封面刚换过，别按旧路径继续发。先核视频、封面、文案三件套。"
  wechat_channels:
    title: "一致再发"
    description: "小马想按文件名继续发布，大陈叫停：先锁视频、封面、文案三件套，确认一致再发。"
  weibo:
    title: "文件名一样，就能直接继续发布吗？"
    description: "不能。文件名一样，不代表视频、封面、文案还是同一版。发布前先锁三件套指纹，一致再发，避免旧封面被平台任务拿走。#AI员工 #内容运营"
  bilibili:
    title: "文件名一样也不能直接发：AI员工先锁视频、封面、文案三件套"
    description: "这条讲发布前最容易漏的一步：不要只看路径和文件名。封面或文案刚改过，就要重新计算视频指纹、封面指纹和文案版本，三件套一致后再进入平台发布。"
  xiaohongshu:
    title: "别让旧封面混进去"
    description: "发布前别只看文件名。视频、封面、文案三件套一致，再交给平台任务。"
  toutiao:
    title: "为什么发布前不能只看文件名，还要锁视频、封面和文案？"
    description: "因为文件名一样，不代表资产版本一致。封面或文案刚改过，就要重新核对视频、封面、文案三件套，避免平台任务使用旧素材。"
  baijiahao:
    title: "发布前如何避免平台任务拿到旧封面？"
    description: "不要只看文件名和路径。更稳妥的做法是先锁视频指纹、封面指纹和文案版本，三件套一致后再进入发布任务。"
  zhihu:
    title: "为什么内容发布前要同时核对视频、封面和文案版本？"
    description: "因为文件名和路径可能没变，但封面或文案已经换过。发布前锁定视频指纹、封面指纹和文案版本，可以避免平台任务拿到旧封面或旧文案。"
